<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light">
  <title>Clock — Studio Katra</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23000000'/%3E%3Cpath d='M20 10v11l7 4' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div id="app"><p class="initial-loading" role="status">Chargement de Clock…</p></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="edit-dialog" aria-labelledby="edit-title">
    <form id="edit-form">
      <div class="dialog-heading"><h2 id="edit-title">Modifier une saisie</h2><button type="button" id="close-dialog" class="icon-button" aria-label="Fermer">×</button></div>
      <label>Durée (heures:minutes:secondes)<input name="duration" required pattern="[0-9]{1,2}:[0-5][0-9]:[0-5][0-9]" placeholder="01:30:00"></label>
      <label>Description<textarea name="note" maxlength="500" rows="3"></textarea></label>
      <label>Prestation Furious<select name="projectRateCardId"><option value="">Sans sélection</option><option value="-1">Non vendu (hors grille)</option></select></label>
      <p class="rate-card-hint">Si le projet demande une ligne de grille tarifaire, choisissez la prestation correspondante. « Non vendu » est un choix explicite hors grille.</p>
      <p id="rate-card-status" role="status"></p>
      <p id="edit-error" class="error" role="alert"></p>
      <button type="submit" class="button primary">Enregistrer les modifications</button>
    </form>
  </dialog>
</body>
</html>
